</style></head><body><div class="w"><header><div class="logo">Site<i>Seller</i></div><div id="hd"></div></header><main id="app"></main></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<script>
(function(){
firebase.initializeApp({apiKey:"AIzaSyB3hLTnJviiYcvy7I2R7JuDk6Nk8pJGTQA",authDomain:"site-seller-2c2e1.firebaseapp.com",projectId:"site-seller-2c2e1"});
var ADMIN="a.y.singh001queen@gmail.com",LIMIT=3,auth=firebase.auth(),db=firebase.firestore();
var S={u:null,me:null,tab:null,role:"buyer",reqs:[],deals:[],rates:[],reps:[],msgs:[],cid:null,unc:null,subs:[],pk:{},cm:{},q:""},A={};
var $=function(i){return document.getElementById(i)},ts=function(){return firebase.firestore.FieldValue.serverTimestamp()};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

function rt(id){var x=S.rates.filter(function(r){return r.sellerId===id}),s=0;x.forEach(function(r){s+=r.stars});return{n:x.length,avg:x.length?s/x.length:0}}
function ong(){return S.deals.find(function(d){return d.status==="ongoing"})}
function isB(){return S.me&&S.me.role==="buyer"}
function isAdm(){return S.u&&S.u.email===ADMIN}
function snap(s){return s.docs.map(function(d){return Object.assign({id:d.id},d.data())})}

/* ---------- auth ---------- */
if(auth.isSignInWithEmailLink(location.href)){
 var em=localStorage.getItem("sse")||prompt("Enter your email to confirm");
 auth.signInWithEmailLink(em,location.href).then(function(){history.replaceState({},"",location.pathname)}).catch(function(e){alert("Login error: "+e.code)});
}
auth.onAuthStateChanged(function(u){
 S.u=u;S.subs.forEach(function(f){f()});S.subs=[];
 if(!u){S.me=null;render(1);return}
 db.collection("users").doc(u.uid).get().then(function(d){
  if(d.exists)S.me=d.data();else{var p=null;try{p=JSON.parse(localStorage.getItem("ssp"))}catch(e){}
   if(p&&p.email===u.email){db.collection("users").doc(u.uid).set(p);S.me=p}else S.me=null}
  if(S.me)start();render(1)});
});
function start(){
 S.tab=isB()?"post":"deals";
 var uid=S.u.uid;
 S.subs.push(db.collection("requests").orderBy("ts","desc").limit(200).onSnapshot(function(s){S.reqs=snap(s);render()}));
 S.subs.push(db.collection("deals").where("users","array-contains",uid).onSnapshot(function(s){S.deals=snap(s);
  if(!isB()&&ong())S.deals.forEach(function(d){if(d.sellerId===uid&&d.status==="pending")db.collection("deals").doc(d.id).update({status:"declined"})});
  var o=ong();chat(o?o.id:null);render()}));
 S.subs.push(db.collection("ratings").onSnapshot(function(s){S.rates=snap(s);render()}));
 if(isAdm())S.subs.push(db.collection("reports").onSnapshot(function(s){S.reps=snap(s);render()}));
}
function chat(id){
 if(S.cid===id)return;if(S.unc)S.unc();S.cid=id;S.msgs=[];if(!id)return;
 S.unc=db.collection("deals").doc(id).collection("msgs").orderBy("ts").onSnapshot(function(s){S.msgs=s.docs.map(function(d){return d.data()});paint()});
}
function paint(){var e=$("ml");if(!e)return;
 e.innerHTML=S.msgs.length?S.msgs.map(function(m){return '<div class="b'+(m.uid===S.u.uid?" mi":"")+'"><small>'+esc(m.name)+'</small>'+esc(m.text)+(m.img?'<img src="'+m.img+'">':'')+'</div>'}).join(""):'<div class="em">Say hello 👋</div>';
 e.scrollTop=e.scrollHeight}

/* ---------- views ---------- */
function roles(){return '<label>I am a</label><div class="r"><button class="ro'+(S.role==="buyer"?" on":"")+'" data-a="role" data-i="buyer">Site Buyer</button><button class="ro'+(S.role==="seller"?" on":"")+'" data-a="role" data-i="seller">Site Seller</button></div>'}
function loginV(){return '<div class="c"><h1>Welcome</h1><p class="m">Login with Google (fastest) or with an email link.</p><button class="bt" style="background:#fff" data-a="google">G&nbsp; Continue with Google</button><div class="er" id="gm"></div><p class="m" style="text-align:center">— or use email link —</p><label>Full name</label><input id="n"><label>Place</label><input id="pl"><label>Phone</label><input id="ph" type="tel"><label>Email</label><input id="em" type="email">'+roles()+'<button class="bt" data-a="login">Send login link</button><div class="er" id="lm"></div></div>'}
function profV(){return '<div class="c"><h1>Complete your profile</h1><label>Full name</label><input id="n" value="'+esc(S.u&&S.u.displayName||"")+'"><label>Place</label><input id="pl"><label>Phone</label><input id="ph" type="tel">'+roles()+'<button class="bt" data-a="prof">Save</button><div class="er" id="lm"></div></div>'}
function tabs(){var t=isB()?[["post","Post"]]:[["deals","Deals"]];t.push(["ongoing","Ongoing"+(ong()?" 🟢":"")],["rate","Ratings ⭐"]);
 return '<div class="tabs">'+t.map(function(x){return '<button class="'+(S.tab===x[0]?"on":"")+'" data-a="tab" data-i="'+x[0]+'">'+x[1]+'</button>'}).join("")+'</div>'}
function today(){var d=new Date();d.setHours(0,0,0,0);return S.reqs.filter(function(r){return r.uid===S.u.uid&&r.ts&&r.ts.toMillis()>d.getTime()}).length}
function postV(){
 var mine=S.reqs.filter(function(r){return r.uid===S.u.uid});
 return '<div class="c"><h2>Describe the website you want to buy</h2><textarea id="d" maxlength="2000" placeholder="Minimum 30 words..."></textarea><div class="m" id="wc" style="text-align:right">0 / 30 words</div><button class="bt" id="pb" data-a="post" disabled>Post my requirement</button><div class="er" id="pm"></div></div><h2>My requirements</h2>'+
 (mine.length?mine.map(function(r){
  var of=S.deals.filter(function(d){return d.reqId===r.id&&d.status==="pending"});
  return '<div class="c"><span class="bd'+(r.status==="ongoing"?" w2":"")+'">'+(r.status==="ongoing"?"In deal":"Open")+'</span><div class="p">'+esc(r.desc)+'</div>'+
  of.map(function(d){var q=rt(d.sellerId);return '<div class="lb"><div><b>'+esc(d.sellerName)+'</b><div class="m">wants this deal</div></div><div class="v">'+(q.n?stars(q.avg)+'<div class="m">'+q.avg.toFixed(1)+' ('+q.n+')</div>':'<div class="m">New seller</div>')+'<button class="bt sm" data-a="accept" data-i="'+d.id+'">Accept deal</button></div></div>'}).join("")+
  '<button class="gh dg" data-a="del" data-i="'+r.id+'">Delete</button></div>'}).join(""):'<div class="em">No requirements yet.</div>')}
function dealsV(){
 var o=ong(),q=S.q.toLowerCase(),L=S.reqs.filter(function(r){return r.status!=="ongoing"&&(!q||(r.desc+r.place+r.name).toLowerCase().indexOf(q)>-1)});
 return (o?'<div class="aad">You have an ongoing deal. Finish it before choosing another.</div>':'')+'<input id="q" placeholder="Search deals or places..." value="'+esc(S.q)+'" style="margin-bottom:12px"><h2>Available deals</h2>'+
 (L.length?L.map(function(r){
  var mo=S.deals.find(function(d){return d.id===r.id+"_"+S.u.uid&&d.status==="pending"}),rc=S.reps.filter(function(x){return x.reqId===r.id}).length;
  return '<div class="c"><b>'+esc(r.name)+'</b> <span class="m">· '+esc(r.place)+'</span>'+(isAdm()?' <span class="bd w2">'+rc+' reports</span>':'')+'<div class="p">'+esc(r.desc)+'</div>'+
  (mo?'<span class="bd w2">Waiting for buyer to accept</span>':'<button class="bt sm" '+(o?'disabled':'')+' data-a="offer" data-i="'+r.id+'">Accept deal</button>')+
  '<button class="gh sm" data-a="rep" data-i="'+r.id+'">Report</button>'+(isAdm()?'<button class="gh dg sm" data-a="del" data-i="'+r.id+'">Delete</button>':'')+'</div>'}).join(""):'<div class="em">No deals yet.</div>')}
function ongV(){
 var d=ong();if(!d)return '<div class="em">🤝<br>No ongoing deal.<br>'+(isB()?"Accept a seller's offer to start one.":"Accept a deal and wait for the buyer to accept too.")+'</div>';
 var b=isB(),other=b?d.sellerName:d.buyerName,ph=b?d.sellerPhone:d.buyerPhone;
 return '<div class="c"><span class="bd">Ongoing</span><h2>Deal with '+esc(other)+'</h2><div class="p m">'+esc(d.desc)+'</div>'+
 '<div class="aad">🪪 <b>Safety:</b> Ask '+(b?"the seller":"the buyer")+' for their <b>Aadhaar card</b> and send yours too. If the buying or selling is unfair, it can be reported to the police. Please do not send your Aadhaar photo in this chat; show it directly or on WhatsApp.</div>'+
 '<a class="bt sm" href="tel:'+esc(ph)+'">📞 Call '+esc(other)+'</a>'+(b?"":'<button class="bt sm dg" style="background:#2a1111;color:var(--e)" data-a="done">✔ Done</button>')+
 '<div id="ml"></div><div class="cr"><label class="gh">📷<input id="pf" type="file" accept="image/*" hidden></label><input id="ci" placeholder="Type a message..."><button class="bt" data-a="send">Send</button></div></div>'}
function rateV(){
 var h="",tr=S.deals.filter(function(d){return isB()&&d.status==="done"&&!S.rates.some(function(r){return r.dealId===d.id})});
 tr.forEach(function(d){var p=S.pk[d.id]||0;
  h+='<div class="c" style="border-color:var(--g)"><h2>Rate '+esc(d.sellerName)+'</h2><div class="pk">'+[1,2,3,4,5].map(function(n){return '<span class="'+(n<=p?"on":"")+'" data-a="pick" data-i="'+d.id+'" data-n="'+n+'">★</span>'}).join("")+'</div><textarea id="cm" data-i="'+d.id+'" style="min-height:70px;margin-top:8px" placeholder="Write a short review (optional)">'+esc(S.cm[d.id]||"")+'</textarea><button class="bt" data-a="rate" data-i="'+d.id+'">Submit rating</button></div>'});
 var g={};S.rates.forEach(function(r){g[r.sellerId]=r.sellerName});
 var L=Object.keys(g).map(function(k){var q=rt(k);return{id:k,name:g[k],avg:q.avg,n:q.n}}).sort(function(a,b){return b.avg-a.avg||b.n-a.n});
 h+='<h2>🏆 Top rated sellers</h2>'+(L.length?L.map(function(x,i){return '<div class="lb'+(x.id===S.u.uid?" me":"")+'"><div class="n">'+(["🥇","🥈","🥉"][i]||i+1)+'</div><div><b>'+esc(x.name)+'</b>'+(x.id===S.u.uid?' <span class="bd w2">You</span>':'')+'<div>'+stars(x.avg)+'</div></div><div class="v"><big>'+x.avg.toFixed(1)+'</big><span class="m">'+x.n+' rating'+(x.n>1?"s":"")+'</span></div></div>'}).join(""):'<div class="em">No ratings yet. Ratings come only from real completed deals.</div>');
 var rv=S.rates.filter(function(r){return r.comment});
 if(rv.length)h+='<h2>Recent reviews</h2>'+rv.slice(0,10).map(function(r){return '<div class="c">'+stars(r.stars)+' <b>'+esc(r.sellerName)+'</b><div class="p">'+esc(r.comment)+'</div><div class="m">— '+esc(r.buyerName)+'</div></div>'}).join("");
 return h}
function render(f){
 var a=document.activeElement;if(!f&&a&&/INPUT|TEXTAREA/.test(a.tagName)&&$("app").contains(a))return;
 var el=$("app");$("hd").innerHTML=S.u?'<button class="gh" data-a="out">Logout</button>':"";
 if(!S.u){el.innerHTML=loginV();return}
 if(!S.me){el.innerHTML=profV();return}
 var v={post:postV,deals:dealsV,ongoing:ongV,rate:rateV}[S.tab]();
 el.innerHTML='<p class="m">Hi <b>'+esc(S.me.name)+'</b> · <span class="bd">'+(isB()?"Site Buyer":"Site Seller")+'</span></p>'+tabs()+v;
 if(S.tab==="ongoing")paint()}

/* ---------- actions ---------- */
A.tab=function(i){S.tab=i;render(1)};
A.role=function(i){S.role=i;var v=["n","pl","ph","em"].map(function(k){return $(k)?$(k).value:""});render(1);["n","pl","ph","em"].forEach(function(k,j){if($(k))$(k).value=v[j]})};
A.google=function(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){msg("gm","Error: "+e.code)})};
A.out=function(){auth.signOut()};
function read(){return{name:$("n").value.trim(),place:$("pl").value.trim(),phone:$("ph").value.replace(/\D/g,""),role:S.role}}
A.login=function(){var p=read();p.email=$("em").value.trim().toLowerCase();
 if(!p.name||!p.place||p.phone.length<10||p.email.indexOf("@")<1)return msg("lm","Please fill all fields (phone: 10 digits).");
 localStorage.setItem("ssp",JSON.stringify(p));localStorage.setItem("sse",p.email);
 auth.sendSignInLinkToEmail(p.email,{url:location.origin+location.pathname,handleCodeInApp:true}).then(function(){msg("lm","Link sent! Open it from your inbox (check spam).",1)}).catch(function(e){msg("lm","Error: "+e.code)})};
A.prof=function(){var p=read();p.email=S.u.email;if(!p.name||!p.place||p.phone.length<10)return msg("lm","Please fill all fields.");
 db.collection("users").doc(S.u.uid).set(p).then(function(){S.me=p;start();render(1)}).catch(function(e){msg("lm","Error: "+e.code)})};
A.post=function(){var t=$("d").value.trim();if(words(t)<30)return;if(today()>=LIMIT)return msg("pm","Daily limit reached ("+LIMIT+" posts).");
 db.collection("requests").add({uid:S.u.uid,name:S.me.name,place:S.me.place,phone:S.me.phone,desc:t,status:"open",ts:ts()}).then(function(){$("d").value="";upd();msg("pm","Posted!",1)}).catch(function(e){msg("pm","Could not post: "+e.code)})};
A.del=function(i){if(confirm("Delete this post?"))db.collection("requests").doc(i).delete()};
A.rep=function(i){db.collection("reports").doc(i+"_"+S.u.uid).set({reqId:i,uid:S.u.uid,ts:ts()}).then(function(){alert("Reported. Thank you.")})};
A.offer=function(i){var r=S.reqs.find(function(x){return x.id===i});if(ong())return alert("Finish your ongoing deal first.");
 db.collection("deals").doc(i+"_"+S.u.uid).set({reqId:i,buyerId:r.uid,sellerId:S.u.uid,users:[r.uid,S.u.uid],buyerName:r.name,sellerName:S.me.name,buyerPhone:r.phone,sellerPhone:S.me.phone,desc:r.desc,status:"pending",sellerOk:true,buyerOk:false,ts:ts()}).catch(function(e){alert("Error: "+e.code)})};
A.accept=function(i){if(ong())return alert("You already have an ongoing deal.");var d=S.deals.find(function(x){return x.id===i});
 if(!confirm("Accept "+d.sellerName+"? Both of you will enter an ongoing deal with chat."))return;
 var b=db.batch();S.deals.forEach(function(x){if(x.reqId===d.reqId&&x.status==="pending")b.update(db.collection("deals").doc(x.id),{status:x.id===i?"ongoing":"declined",buyerOk:x.id===i})});
 b.update(db.collection("requests").doc(d.reqId),{status:"ongoing"});
 b.commit().then(function(){S.tab="ongoing";render(1)}).catch(function(e){alert("Error: "+e.code)})};
A.done=function(){var d=ong();if(!d)return;
 if(!confirm("⚠️ WARNING\n\nIf the selling/buying process was unfair, it can be reported to the police.\n\nMark this deal as DONE? Chat will close for both sides."))return;
 db.collection("deals").doc(d.id).update({status:"done"}).then(function(){S.tab="deals";render(1)})};
A.send=function(){var d=ong(),i=$("ci"),t=i.value.trim();if(!d||!t)return;i.value="";
 db.collection("deals").doc(d.id).collection("msgs").add({uid:S.u.uid,name:S.me.name,text:t.slice(0,500),ts:ts()}).catch(function(){alert("Chat is closed.")})};
A.pick=function(i,n){S.pk[i]=+n;render(1)};
A.rate=function(i){var d=S.deals.find(function(x){return x.id===i}),s=S.pk[i];if(!s)return alert("Tap the stars first.");
 db.collection("ratings").doc(i).set({dealId:i,sellerId:d.sellerId,sellerName:d.sellerName,buyerId:S.u.uid,buyerName:S.me.name,stars:s,comment:(S.cm[i]||"").slice(0,300),ts:ts()}).catch(function(e){alert("Error: "+e.code)})};

document.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.i,b.dataset.n)});
document.addEventListener("input",function(e){var t=e.target;if(t.id==="d")upd();if(t.id==="cm")S.cm[t.dataset.i]=t.value;if(t.id==="q"){S.q=t.value}});
document.addEventListener("change",function(e){var f=e.target.files&&e.target.files[0];if(e.target.id!=="pf"||!f)return;var d=ong();if(!d)return;
 var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){
