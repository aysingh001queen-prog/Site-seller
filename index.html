 var d=ong();if(!d)return '<div class="em">🤝<br>No ongoing deal.<br>'+(isB()?"Accept a seller's offer to start one.":"Accept a deal and wait for the buyer to accept too.")+'</div>';
 var b=isB(),other=b?d.sellerName:d.buyerName,ph=b?d.sellerPhone:d.buyerPhone;
 return '<div class="c"><span class="bd">Ongoing</span><h2>'+av(b?d.sellerImg:d.buyerImg,other,40)+' Deal with '+esc(other)+'</h2><div class="m">Seller rating: '+(function(){var q=rt(d.sellerId);return q.n?stars(q.avg)+" "+q.avg.toFixed(1)+" ("+q.n+")":"New seller, no ratings yet"})()+'</div><div class="p m">'+esc(d.desc)+'</div>'+
 '<div class="aad">🪪 <b>Safety:</b> Ask '+(b?"the seller":"the buyer")+' for their <b>Aadhaar card</b> and send yours too. If the buying or selling is unfair, it can be reported to the police. Please do not send your Aadhaar photo in this chat; show it directly or on WhatsApp.</div>'+
 '<a class="bt sm" href="tel:'+esc(ph)+'">📞 Call '+esc(other)+'</a>'+(b?"":'<button class="bt sm dg" style="background:#2a1111;color:var(--e)" data-a="done">✔ Done</button>')+
 '<div id="ml"></div><div class="cr"><label class="gh">📷<input id="pf" type="file" accept="image/*" hidden></label><input id="ci" placeholder="Type a message..."><button class="bt" data-a="send">Send</button></div></div>'}
function rateV(){
 var h="",tr=S.deals.filter(function(d){return isB()&&d.status==="done"&&!S.rates.some(function(r){return r.dealId===d.id})});
 tr.forEach(function(d){var p=S.pk[d.id]||0;
  h+='<div class="c" style="border-color:var(--g)"><h2>Rate '+esc(d.sellerName)+'</h2><div class="pk">'+[1,2,3,4,5].map(function(n){return '<span class="'+(n<=p?"on":"")+'" data-a="pick" data-i="'+d.id+'" data-n="'+n+'">★</span>'}).join("")+'</div><textarea id="cm" data-i="'+d.id+'" style="min-height:70px;margin-top:8px" placeholder="Write a short review (optional)">'+esc(S.cm[d.id]||"")+'</textarea><button class="bt" data-a="rate" data-i="'+d.id+'">Submit rating</button></div>'});
 var g={};S.rates.forEach(function(r){g[r.sellerId]=r.sellerName});
 var L=Object.keys(g).map(function(k){var q=rt(k);return{id:k,name:g[k],avg:q.avg,n:q.n}}).sort(function(a,b){return b.avg-a.avg||b.n-a.n});
 h+='<h2>🏆 Top rated sellers</h2>'+(L.length?L.map(function(x,i){return '<div class="lb'+(x.id===S.u.uid?" me":"")+'"><div class="n">'+(["🥇","🥈","🥉"][i]||i+1)+'</div><div><b>'+esc(x.name)+'</b>'+(x.id===S.u.uid?' <span class="bd w2">You</span>':'')+'<div>'+stars(x.avg)+'</div></div><div class="v"><big>'+x.avg.toFixed(1)+'</big><span class="m">'+x.n+' rating'+(x.n>1?"s":"")+'</span></div></div>'}).join(""):'<div class="em">No ratings yet. Ratings come only from real completed deals.</div>');
 var rv=S.rates.filter(function(r){return r.comment});
 if(rv.length)h+='<h2>Recent reviews</h2>'+rv.slice(0,10).map(function(r){return '<div class="c">'+stars(r.stars)+' <b>'+esc(r.sellerName)+'</b><div class="p">'+esc(r.comment)+'</div><div class="m">— '+esc(r.buyerName)+'</div></div>'}).join("");
 return h}
function render(f){
 var a=document.activeElement;if(!f&&a&&/INPUT|TEXTAREA/.test(a.tagName)&&$("app").contains(a))return;
 var el=$("app");$("hd").innerHTML=S.u?menu():"";
 if(!S.u){el.innerHTML=loginV();return}
 if(!S.me){el.innerHTML=profV();return}
 if(S.ed){el.innerHTML=editV();return}
 var v={post:postV,deals:dealsV,ongoing:ongV,hist:histV,rate:rateV}[S.tab]();
 el.innerHTML='<p class="m">'+av(S.me.photo,S.me.name,30)+' Hi <b>'+esc(S.me.name)+'</b> · <span class="bd">'+(isB()?"Site Buyer":"Site Seller")+'</span></p>'+tabs()+v+(S.dn?'<div class="mo"><div class="c"><h2 style="color:var(--e)">⚠️ Warning</h2><p>If the selling or buying process was <b>unfair</b>, it can be <b>reported to the police</b>.</p><p class="m">Mark this deal as DONE? Chat will close for both sides.</p><button class="bt" data-a="dyes">Yes, mark as Done</button><button class="bt" style="background:#222;color:#fff" data-a="dno">Cancel</button></div></div>':'')+'<p class="m" style="text-align:center;margin-top:24px">App version 10</p>';
 if(S.tab==="ongoing")paint()}

/* ---------- actions ---------- */
A.tab=function(i){S.tab=i;render(1)};
A.role=function(i){S.role=i;var v=["n","pl","ph","em"].map(function(k){return $(k)?$(k).value:""});render(1);["n","pl","ph","em"].forEach(function(k,j){if($(k))$(k).value=v[j]})};
A.google=function(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){msg("gm","Error: "+e.code)})};
A.mn=function(){S.mn=!S.mn;render(1)};
A.edit=function(){S.mn=0;S.ed=1;S.np=null;S.role=S.me.role;render(1)};
A.canc=function(){S.np=null;S.ed=0;render(1)};
A.saveP=function(){var pl=$("pl").value.trim();if(!pl)return msg("lm","Place cannot be empty.");if(S.role!==S.me.role&&ong())return msg("lm","Finish your ongoing deal before changing role.");
 var up={place:pl,role:S.role};if(S.np)up.photo=S.np;db.collection("users").doc(S.u.uid).update(up).then(function(){S.me.place=pl;S.me.role=S.role;if(S.np)S.me.photo=S.np;S.np=null;S.ed=0;start();render(1)}).catch(function(e){msg("lm","Error: "+e.code)})};
A.out=function(){S.mn=0;S.ed=0;auth.signOut()};
function read(){return{name:$("n").value.trim(),place:$("pl").value.trim(),phone:$("ph").value.replace(/\D/g,""),role:S.role}}
A.login=function(){var p=read();p.email=$("em").value.trim().toLowerCase();
 if(!p.name||!p.place||p.phone.length<10||p.email.indexOf("@")<1)return msg("lm","Please fill all fields (phone: 10 digits).");
 localStorage.setItem("ssp",JSON.stringify(p));localStorage.setItem("sse",p.email);
 auth.sendSignInLinkToEmail(p.email,{url:location.origin+location.pathname,handleCodeInApp:true}).then(function(){msg("lm","Link sent! Open it from your inbox (check spam).",1)}).catch(function(e){msg("lm","Error: "+e.code)})};
A.prof=function(){var p=read();p.email=S.u.email;p.photo=S.np||"";if(!p.name||!p.place||p.phone.length<10)return msg("lm","Please fill all fields.");
 db.collection("users").doc(S.u.uid).set(p).then(function(){S.me=p;S.np=null;start();render(1)}).catch(function(e){msg("lm","Error: "+e.code)})};
A.post=function(){var t=$("d").value.trim();if(words(t)<30)return;if(today()>=LIMIT)return msg("pm","Daily limit reached ("+LIMIT+" posts).");
 db.collection("requests").add({uid:S.u.uid,name:S.me.name,place:S.me.place,phone:S.me.phone,img:S.me.photo||"",desc:t,status:"open",ts:ts()}).then(function(){$("d").value="";upd();msg("pm","Posted!",1)}).catch(function(e){msg("pm","Could not post: "+e.code)})};
A.del=function(i){if(confirm("Delete this post?"))db.collection("requests").doc(i).delete()};
A.rep=function(i){db.collection("reports").doc(i+"_"+S.u.uid).set({reqId:i,uid:S.u.uid,ts:ts()}).then(function(){alert("Reported. Thank you.")})};
A.offer=function(i){var r=S.reqs.find(function(x){return x.id===i});if(ong())return alert("Finish your ongoing deal first.");
 db.collection("deals").doc(i+"_"+S.u.uid).set({reqId:i,buyerId:r.uid,sellerId:S.u.uid,users:[r.uid,S.u.uid],buyerName:r.name,sellerName:S.me.name,buyerPhone:r.phone,sellerPhone:S.me.phone,sellerImg:S.me.photo||"",buyerImg:r.img||"",desc:r.desc,status:"pending",sellerOk:true,buyerOk:false,ts:ts()}).catch(function(e){alert("Error: "+e.code)})};
A.accept=function(i){if(ong())return alert("You already have an ongoing deal.");var d=S.deals.find(function(x){return x.id===i});
 var q=rt(d.sellerId),rs=q.n?"rating "+q.avg.toFixed(1)+"/5 from "+q.n+" buyer"+(q.n>1?"s":""):"no ratings yet";
 if(!confirm("Accept "+d.sellerName+" ("+rs+")? Both of you will enter an ongoing deal with chat."))return;
 var b=db.batch();S.deals.forEach(function(x){if(x.reqId===d.reqId&&x.status==="pending")b.update(db.collection("deals").doc(x.id),{status:x.id===i?"ongoing":"declined",buyerOk:x.id===i})});
 b.update(db.collection("requests").doc(d.reqId),{status:"ongoing"});
 b.commit().then(function(){S.tab="ongoing";render(1)}).catch(function(e){alert("Error: "+e.code)})};
A.done=function(){if(ong()){S.dn=1;render(1)}};
A.dno=function(){S.dn=0;render(1)};
A.dyes=function(){var d=ong();S.dn=0;if(!d)return render(1);db.collection("deals").doc(d.id).update({status:"done",doneTs:ts()}).then(function(){S.tab="deals";render(1)})};
A.send=function(){var d=ong(),i=$("ci"),t=i.value.trim();if(!d||!t)return;i.value="";
 db.collection("deals").doc(d.id).collection("msgs").add({uid:S.u.uid,name:S.me.name,text:t.slice(0,500),ts:ts()}).catch(function(){alert("Chat is closed.")})};
A.pick=function(i,n){S.pk[i]=+n;render(1)};
A.rate=function(i){var d=S.deals.find(function(x){return x.id===i}),s=S.pk[i];if(!s)return alert("Tap the stars first.");
 db.collection("ratings").doc(i).set({dealId:i,sellerId:d.sellerId,sellerName:d.sellerName,buyerId:S.u.uid,buyerName:S.me.name,stars:s,comment:(S.cm[i]||"").slice(0,300),ts:ts()}).catch(function(e){alert("Error: "+e.code)})};
function upd(){var t=$("d");if(!t)return;var n=words(t.value);$("wc").textContent=n+" / 30 words";$("wc").className="m"+(n>=30?" ok":"");$("pb").disabled=n<30}
document.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.i,b.dataset.n)});
document.addEventListener("input",function(e){var t=e.target;if(t.id==="d")upd();if(t.id==="cm")S.cm[t.dataset.i]=t.value;if(t.id==="q"){S.q=t.value}});
document.addEventListener("change",function(e){var f=e.target.files&&e.target.files[0];if(e.target.id!=="pf"||!f)return;var d=ong();if(!d)return;
 var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){
  var m=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*m;c.height=im.height*m;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  var u=c.toDataURL("image/jpeg",.6);if(u.length>700000)u=c.toDataURL("image/jpeg",.35);if(u.length>900000)return alert("Photo too big. Try another one.");
  db.collection("deals").doc(d.id).collection("msgs").add({uid:S.u.uid,name:S.me.name,text:"",img:u,ts:ts()}).catch(function(){alert("Chat is closed.")});e.target.value=""};im.onerror=function(){alert("Could not read this photo.")};im.src=rd.result};rd.readAsDataURL(f)});
document.addEventListener("change",function(e){var f=e.target.files&&e.target.files[0];if(e.target.id!=="av"||!f)return;shrink(f,160,function(u){S.np=u;var w=$("avw");if(w)w.innerHTML=av(u,"",S.me?96:80)})});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="ci")A.send()});
document.addEventListener("focusout",function(e){if(e.target.id==="q")render(1)});
render(1);
})();
